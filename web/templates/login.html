{{define "content"}}
<h1>ログイン</h1>
<form method="post" action="/login" class="form">
  <div class="form-part">
    <label for="email">メールアドレス<span class="req">※必須</span></label>
    <input type="email" id="email" name="email" value="{{.V.Email}}" required autocomplete="email">
  </div>
  <div class="form-part">
    <label for="password">パスワード<span class="req">※必須</span></label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <p><button type="submit" class="btn btn-solid">ログインする</button></p>
</form>
<p>アカウントをお持ちでない方は <a href="/register">新規登録</a> へ。</p>
{{end}}
